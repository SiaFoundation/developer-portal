name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Keyed by ref, so a manual run on another branch cannot cancel a production deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # A run started by hand can pick any branch, and only master is deployed.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'

      - run: npm install --global bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        run: bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
